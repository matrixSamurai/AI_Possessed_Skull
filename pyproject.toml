[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "malachi-skull"
version = "0.1.0"
description = "MALACHI autonomous animatronic skull, with an offline desktop simulator"
requires-python = ">=3.11,<3.13"
dependencies = [
 "numpy==1.26.4", "opencv-contrib-python==4.11.0.86", "mediapipe==0.10.21",
 "PySide6==6.8.3", "pydantic-settings==2.8.1", "sounddevice==0.5.1", "pyserial==3.5"
]
[project.optional-dependencies]
conversation = ["elevenlabs==2.71.0"]
dev = ["pytest==8.3.5", "pytest-qt==4.4.0", "ruff==0.11.2"]
[project.scripts]
malachi = "malachi.main:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
